<title>OPS Training</title>

<style>
/* Mise en page : bandeau rouge opérationnel, contenu en fiches sobres, poste de commandement en deux colonnes (photo | échanges, SOIEC, message). */
:root{
  --bg:#eef0f2; --card:#ffffff; --ink:#1b2127; --mut:#667079; --line:#d8dde1;
  --red:#c42a1c; --red-d:#9d2015; --on-red:#ffffff; --ok:#16794a; --warn-bg:#fdf1d6; --soft:#f5f6f7;
  --me:#c42a1c; --me-ink:#ffffff;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif; --f-b:"Barlow",system-ui,sans-serif; --f-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181c; --card:#1e2429; --ink:#eceff1; --mut:#97a2ab; --line:#333c43; --red:#e0483a; --red-d:#c42a1c; --ok:#4cc38a; --warn-bg:#3b3014; --soft:#262d33; --me:#b8281b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --card:#1e2429; --ink:#eceff1; --mut:#97a2ab; --line:#333c43; --red:#e0483a; --red-d:#c42a1c; --ok:#4cc38a; --warn-bg:#3b3014; --soft:#262d33; --me:#b8281b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:.9375rem/1.5 var(--f-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-d);letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--red);color:var(--on-red);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-d);font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar button{background:transparent;color:var(--on-red);border:1px solid rgba(255,255,255,.45);padding:5px 12px;border-radius:6px;font:inherit;cursor:pointer}
.bar button.on{background:#fff;color:var(--red-d)}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.scol{min-width:0}@media(max-width:900px){.sgrid{grid-template-columns:1fr}}
.timer{font-family:var(--f-m);background:rgba(0,0,0,.25);padding:3px 10px;border-radius:6px}.timer.late{background:#f5b82e;color:#000}
main{max-width:1180px;margin:0 auto}
/* pages de contenu : cartes en colonnes sur toute la largeur */
main.pg-profil,main.pg-aide,main.pg-aidesalle,main.pg-apropos,main.pg-cgu,main.pg-nouveautes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
main.pg-profil,main.pg-aide{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card.form select{width:100%}
main.pg-profil>*,main.pg-aide>*,main.pg-aidesalle>*,main.pg-apropos>*,main.pg-cgu>*,main.pg-nouveautes>*{grid-column:1/-1;min-width:0}
main.pg-profil>.card,main.pg-aide>.card,main.pg-aidesalle>.card,main.pg-apropos>.card,main.pg-cgu>.card,main.pg-nouveautes>.card{grid-column:auto;margin:0}
main.pg-aide>.card.span,main.pg-nouveautes>.card.span{grid-column:1/-1}

.muted{color:var(--mut)}.pre{white-space:pre-wrap}.err{color:#d6382a}.okt{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;min-width:0}
.card.warn{background:var(--warn-bg)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:7px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--red)}.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.dng{color:#d6382a}.btn.big{padding:11px 22px;font-size:1.05rem;margin-top:10px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.dom{background:var(--card);border-color:var(--pri,#c0392b);font-weight:600}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
select{width:auto;max-width:100%}textarea{resize:vertical}input[type=checkbox]{width:auto}
.form label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}.form label.ck{display:flex;gap:8px;align-items:center;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scn{padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;margin:0}.scn img,.scn .ph{flex:none}.scn:hover{border-color:var(--red)}
.scn img,.scn .ph{width:100%;height:150px;object-fit:cover;display:block}.scn .b{padding:12px}
.scn .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}.scn .b{display:flex;flex-direction:column;flex:1}.scn .b h2{margin:0 0 4px;font-size:1.05rem}.meta{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;margin-top:4px;font-size:.88rem}.st{font-weight:700}.st.ok{color:var(--ok)}.st.br{color:#b26a00}.bdg{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.tag.dom,.tag.evo{border:0;font-weight:600;font-size:.72rem;padding:2px 8px;background:#fde8ec;color:#c8102e}.tag.evo{background:#fff3d6;color:#8a5a12}.scn .tag{border:0;font-weight:600;font-size:.72rem;padding:2px 8px;margin:0 4px 4px 0;background:#eef1f6;color:#3b4658}.scn .tag.dom{background:#fde8ec;color:#c8102e}.scn .tag.evo{background:#fff3d6;color:#8a5a12}.scn .b p,.scn-body p{margin:0 0 8px;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}


.ph{background:var(--soft);color:var(--mut);display:grid;place-items:center}.ph.tall{height:200px;border-radius:8px}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--soft)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:10px 0;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;font:inherit;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--red);border-color:var(--red);font-weight:600}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.photo{width:100%;max-height:380px;object-fit:contain;background:#000;border-radius:8px;cursor:zoom-in;display:block}.photo.z{max-height:none;cursor:zoom-out}
.photo.prev{max-height:200px;width:auto}
.consigne{font-style:italic}
.domblk{margin:18px 0 6px}.domblk>label{margin:0 0 8px}.domblk .doml{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.domblk .row{margin:0 0 10px}.domblk .chips{margin:0}.domblk+label{margin-top:20px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit}.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chat{height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft)}
.bub{max-width:88%;padding:7px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bub small{display:block;opacity:.7;font-size:.72rem}
.bub.me{background:var(--me);color:var(--me-ink);margin-left:auto}.bub.th{background:var(--card);border:1px solid var(--line)}
.ask{display:flex;gap:8px;margin-top:8px}
.note label{display:block;font-size:.9rem;margin:8px 0 3px}
.sc{overflow-x:auto}.cmp{width:100%;border-collapse:collapse;min-width:520px}.cmp th,.cmp td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left;white-space:pre-wrap}.cmp thead th,.cmp tbody th{background:var(--soft)}.cmp tbody th{width:130px}
.checks{list-style:none;padding:0;margin:0}.checks .y{color:var(--ok)}.checks .n{color:#d6382a}
.stick{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:20;max-width:90%}
.rub{font-size:1.3rem;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}.rub .muted{font-size:.9rem;font-family:var(--f-b)}
.foot{margin:48px 0 0;padding:0;background:#1b2127;color:#c9d0d6;font-size:.9rem;text-align:left;border-top:4px solid #c42a1c;max-width:none}
.foot a{color:#e8ecef;text-decoration:none;cursor:pointer}.foot a:hover{color:#fff;text-decoration:underline}
.foot .fin{max-width:1480px;margin:0 auto;padding:30px 24px 22px;display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(3,minmax(140px,1fr));gap:28px}
.foot .fbrand{display:flex;flex-direction:column;gap:10px}.foot .fbrand b{color:#fff;font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;letter-spacing:.02em}
.foot .fbrand span{color:#9aa4ad;max-width:320px}
.foot h4{margin:0 0 10px;color:#fff;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.foot .fcopy{border-top:1px solid #2e373f;text-align:center;padding:14px 24px;color:#8a949d;font-size:.8rem}
@media(max-width:760px){.foot .fin{grid-template-columns:1fr 1fr}.foot .fbrand{grid-column:1/-1}}
.intro{max-width:620px;margin:24px auto;text-align:center}
@media(max-width:800px){.play,.cols{grid-template-columns:1fr}}
.modal-fond{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto}
.cnt{display:inline-flex;gap:10px;align-items:center;font-size:.85rem;opacity:.95}.cnt .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;display:inline-block;margin-right:4px}
.fmap{width:100%;max-height:640px}.fmap path{stroke:var(--card,#fff);stroke-width:.6;cursor:pointer}.fmap path:hover{stroke:#000;stroke-width:1.2}.fmap path.sel{stroke:#000;stroke-width:2}

/* ---- finition : typographie, espacements, boutons, cartes ---- */
:root{--sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--sh2:0 4px 16px rgba(0,0,0,.14)}
body{line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:clamp(1.6rem,3.2vw,2.1rem);margin:6px 0 14px}
h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:0 0 .7em}
.card{box-shadow:var(--sh);border-radius:12px;padding:16px;margin:12px 0}
.card.scn{padding:0}
.btn{font-weight:500;min-height:36px;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:not(.pri):not(.primary):not(.dng):not(.danger):hover{background:var(--soft)}
.btn.pri,.btn.primary{font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.btn.dng,.btn.danger{border-color:currentColor}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:2px solid color-mix(in srgb,var(--red) 35%,transparent);outline-offset:0}
.scn{transition:transform .15s,box-shadow .15s,border-color .15s}
.scn:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.muted{font-size:.93em}
.rubtog{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.rubtog .chev{display:inline-block;width:1.1em;transition:transform .2s;color:var(--red)}
.rubtog[aria-expanded=false] .chev{transform:rotate(-90deg)}
.rubtog:hover .rname{color:var(--red)}
.rubbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.burger{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.bar{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.bar nav{gap:4px}
.bar nav>button,.bar nav>span>button{border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:7px 12px;opacity:.92;transition:background .15s}
.bar nav>button:hover{background:rgba(255,255,255,.14);opacity:1}
.bar nav>button.on{background:rgba(255,255,255,.18);color:#fff;border-bottom-color:#fff;opacity:1;font-weight:600}
.bar nav>span>button{border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 9px}
.bar .burger{border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:5px 12px;font-size:1.1rem}
@media(max-width:760px){.bar:not(.nc) .burger{display:inline-block;margin-left:auto}.bar:not(.nc) nav{display:none;width:100%;flex-direction:column;align-items:stretch;gap:2px;padding-top:6px}.bar.open nav{display:flex}.bar:not(.nc) nav>button{text-align:left;border-bottom:0;border-left:3px solid transparent;border-radius:6px}.bar:not(.nc) nav>button.on{border-left-color:#fff}}

/* ---- chrono et alerte d'évolution ---- */
.timer{font-size:1.25rem;font-weight:600;padding:4px 14px;border-radius:8px;transition:background .3s,color .3s;font-variant-numeric:tabular-nums}
.timer.warn{background:#f59e0b;color:#1b2127}
.timer.danger{background:#d6382a;color:#fff;animation:tpulse 1s ease-in-out infinite}
.timer.late{background:#7f1d1d;color:#fff;animation:tpulse .8s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 6px rgba(214,56,42,.35)}}
.evoband{display:flex;gap:14px;align-items:flex-start;border-left:6px solid #c4161c;background:var(--warn-bg,var(--warn,#fdf1d6));border-radius:10px;padding:12px 16px;margin:10px 0;box-shadow:var(--sh);animation:evoin .45s ease-out,evopulse 1.2s ease-in-out .45s 3}
.evoband .evoico{font-size:1.6rem;line-height:1;color:#c4161c}
.evoband p{margin:4px 0 0}
@keyframes evoin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes evopulse{50%{box-shadow:0 0 0 5px rgba(196,22,28,.3)}}
@media(prefers-reduced-motion:reduce){.timer.danger,.timer.late,.evoband{animation:none}}

/* ---- poste de commandement : échanges colorés, SOIEC sous le chat ---- */
@media(min-width:801px){.play{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.chat{height:clamp(260px,40vh,430px)}

/* Graphisme B « Institutionnel » (choisi par l'admin dans Paramètres) */

/* Site vitrine */
.vit{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));--v-navy:#13294b;--v-red:#c42a1c;background:#fff;color:#14233b;font:1rem/1.65 var(--f-b);min-height:100vh}

.vit-hero{background:linear-gradient(135deg,#0d1f3c 0%,#13294b 55%,#1d3d6e 100%);color:#fff;padding:84px 28px 92px;border-bottom:5px solid var(--v-red)}
.vit-hero-in{max-width:1120px;margin:auto;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.vit-hero h1{font-size:clamp(2.4rem,5vw,3.9rem);margin:0 0 18px;text-transform:none}
.vit-lead{font-size:1.15rem;color:#5b6b82;max-width:62ch;margin:0}
.vit-hero .vit-lead{color:#c9d6ea}
.vit-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.vit-hero .vit-btn.ghost{border-color:#fff;color:#fff}
.vit-hero .vit-btn.ghost:hover{background:#fff;color:var(--v-navy)}
.vit-hero-img{width:100%;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.4);aspect-ratio:4/3;object-fit:cover}
.vit-ph{display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}
.vit-sec{padding:84px 28px;scroll-margin-top:60px}
.vit-sec.alt{background:#f4f6f9}
.vit-wrap{max-width:1120px;margin:auto}
.vit-head{max-width:760px;margin-bottom:40px}
.vit-head h2,.vit-split h2{font-size:clamp(1.9rem,3.4vw,2.7rem);color:var(--v-navy);margin:0 0 14px}
.vit-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.vit-split:not(:has(img)){grid-template-columns:minmax(0,760px)}
.vit-split.rev>div{order:2}
.vit-split img,.vit-banner{width:100%;border-radius:8px;box-shadow:0 14px 40px rgba(19,41,75,.18)}
.vit-banner{margin-bottom:36px;max-height:420px;object-fit:cover}
.vit-split p{color:#33445e;font-size:1.08rem}
.vit-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.vit-cards article{background:#fff;border:1px solid #d6dde7;border-top:4px solid var(--v-navy);border-radius:4px;padding:26px 24px}
.vit-sec:not(.alt) .vit-cards article{background:#f8f9fb}
.vit-cards i{font:normal 700 .85rem var(--f-m);color:var(--v-red)}
.vit-cards h3,.vit-steps h3{font-size:1.45rem;color:var(--v-navy);margin:8px 0 8px}
.vit-cards p,.vit-steps p{margin:0;color:#4a5a73}
.vit-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px;counter-reset:n}
.vit-steps li span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--v-navy);color:#fff;font:700 1.3rem var(--f-d);margin-bottom:12px;box-shadow:0 0 0 5px #dfe6f1}
.vit-final{text-align:center;padding:84px 28px;background:var(--v-navy);color:#fff}
.vit-final h2{font-size:clamp(1.9rem,3.4vw,2.7rem);margin:0 0 24px}

.vit-foot a{color:#d6e0f0}

.vit-top{top:0}.vit button.vit-btn{cursor:pointer;font:inherit;font-weight:600}.sf input,.sf textarea,.sf select{width:100%;margin:2px 0 8px;font:inherit}.sf label.l{display:block;font-size:.85rem;color:var(--mut);margin-top:6px}

function initEtat(ex) {

  return { noeud: ex.debut || (ex.noeuds[0] || {}).id, tension: cl(v.tension ?? 50), confiance: cl(v.confiance ?? 20), besoin: 0, temps: 0, tours: [], fin: null, alerte: false };
}

// Applique un choix : les paramètres d'intervention modulent les effets.
function appliquer(ex, st, choix) {
  const c = ex.contexte || {};
  const seuil = c.seuilRenfort ?? 70;
  const avant = { t: st.tension, c: st.confiance, b: st.besoin };
  const alerteAvant = st.tension >= seuil;
  let dT = Number(choix.dT) || 0;
  if (c.alcool) dT = dT > 0 ? Math.round(dT * 1.3) : Math.round(dT * 0.7);   // alcool : s'embrase vite, s'apaise lentement
  const tps = Number(choix.temps) || 1;
  const pression = (c.public === "foule" ? 4 : c.public === "quelques" ? 2 : 0);   // regard du public
  const temps = st.temps + tps;
  const depasse = Math.max(0, temps - (c.tempsMax || 99)) - Math.max(0, st.temps - (c.tempsMax || 99));
  const hors = depasse * 2 * Math.max(1, (c.gravite || 3) - 1);                    // la mission se dégrade : la tension monte
  const tension = cl(st.tension + dT + pression + hors);
  const confiance = cl(st.confiance + (Number(choix.dC) || 0));
  const besoin = cl(st.besoin + (Number(choix.dB) || 0));
  const tech = TECH[choix.technique] || { l: choix.technique, t: "bon" };
  const justifie = choix.technique === "renfort" ? alerteAvant : null;
  let fin = null, noeud = st.noeud;
  const s = String(choix.suite || "");
  if (s.startsWith("fin:")) fin = s.slice(4);
  else if (ex.noeuds.some((n) => n.id === s)) noeud = s;
  else fin = "echec";
  if (tension >= 100 && fin !== "renfort") fin = "echec";
  const tour = {
    noeud: st.noeud, victime: (ex.noeuds.find((n) => n.id === st.noeud) || {}).victime || "",
    texte: choix.texte, technique: choix.technique, type: tech.t, conseil: choix.conseil || "", reaction: choix.reaction || "",
    avant, apres: { t: tension, c: confiance, b: besoin }, temps: tps, alerteAvant, justifie,
  };
  return { noeud, tension, confiance, besoin, temps, tours: [...st.tours, tour], fin, alerte: tension >= seuil };
}

function bilan(ex, st) {
  const c = ex.contexte || {};
  const tM = c.tempsMax || 99;
  const desamorcage = cl(100 - st.tension) * (st.fin === "echec" ? 0.4 : 1);
  const besoin = st.besoin;
  let posture = 100;
  st.tours.forEach((t) => {
    if (t.technique === "contact") posture -= 35;
    else if (t.type === "piege") posture -= 8;
    if (t.alerteAvant && t.type === "piege") posture -= 10;
    if (t.technique === "renfort" && !t.justifie) posture -= 15;
  });
  if (st.fin === "echec") posture -= 20;
  const extra = Math.max(0, st.temps - tM);
  let mission = 100 - 12 * extra;
  if (st.fin === "echec") mission = Math.min(mission, 30);
  if (st.fin === "renfort") mission = Math.min(mission, 55);
  const sc = { desamorcage: cl(desamorcage), besoin: cl(besoin), posture: cl(posture), mission: cl(mission) };
  sc.global = Math.round((sc.desamorcage + sc.besoin + sc.posture + sc.mission) / 4);
  return sc;
}

// Contrôle de l'arbre : impasses, liens cassés, absence de fin « apaisée » atteignable.
function controler(ex) {
  const p = [], ids = new Set((ex.noeuds || []).map((n) => n.id));
  if (!ids.has(ex.debut)) p.push("Le nœud de départ n'existe pas.");
  (ex.noeuds || []).forEach((n) => {
    if (!n.victime) p.push(`Nœud ${n.id} : réplique de la victime vide.`);
    if (!(n.choix || []).length) p.push(`Nœud ${n.id} : aucun choix.`);
    (n.choix || []).forEach((c, i) => {
      if (!c.texte) p.push(`Nœud ${n.id}, choix ${i + 1} : texte vide.`);
      if (!(String(c.suite).startsWith("fin:") || ids.has(c.suite))) p.push(`Nœud ${n.id}, choix ${i + 1} : suite invalide.`);
    });
  });
  const vu = new Set(), pile = [ex.debut]; let apaise = false;
  while (pile.length) {
    const id = pile.pop(); if (vu.has(id)) continue; vu.add(id);
    const n = (ex.noeuds || []).find((x) => x.id === id); if (!n) continue;
    (n.choix || []).forEach((c) => { if (c.suite === "fin:apaise") apaise = true; else if (ids.has(c.suite)) pile.push(c.suite); });
  }

essivité."}, {"id": "d", "texte": "Un équipier fait reculer la foule. Vous : « On va s'isoler un peu, vous n'avez pas besoin qu'on vous regarde. »", "technique": "securite", "dT": -12, "dC": 8, "dB": 15, "temps": 2, "suite": "n2", "reaction": "Il hésite, puis vous suit du regard.", "conseil": "Éloigner le public répond à son besoin de garder la face et sécurise la scène."}]}, {"id": "n2", "victime": "« Je suis pas bourré… j'ai juste bu deux bières. Et vous allez me prendre quoi, mon sac ? Tous ces gens qui me regardent, c'est la honte. »", "choix": [{"id": "a", "texte": "« Vous n'aimez pas être regardé comme ça, vous voulez qu'on garde ça entre nous. Je comprends. »", "technique": "reformulation", "dT": -12, "dC": 12, "dB": 30, "temps": 1, "suite": "n3", "reaction": "Il baisse les yeux, soulagé.", "conseil": "La reformulation met des mots sur la honte et fait émerger le vrai besoin : la dignité."}, {"id": "b", "texte": "« Allez, ce n'est pas grave, tout le monde fait des erreurs. »", "technique": "minimise", "dT": 8, "dC": -8, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Me parlez pas comme à un gosse ! »", "conseil": "Minimiser ou excuser sonne condescendant."}, {"id": "c", "texte": "« Qu'est-ce qui s'est passé juste avant la chute ? »", "technique": "question", "dT": -6, "dC": 8, "dB": 10, "temps": 2, "suite": "n3", "reaction": "Il raconte, un peu moins tendu.", "conseil": "La question ouverte l'implique sans le juger, mais prend du temps."}]}, {"id": "n2b", "victime": "« Dégage ! Je vais te mettre une ! »\n(Il serre les poings, les spectateurs s'approchent.)", "choix": [{"id": "a", "texte": "Vous reculez, mains visibles, de côté. Un équipier écarte calmement le public.", "technique": "securite", "dT": -10, "dC": 5, "dB": 5, "temps": 1, "suite": "n2", "reaction": "Il baisse un peu les poings.", "conseil": "Reculer et dégager l'espace protège l'équipe et laisse une porte de sortie à la victime."}, {"id": "b", "texte": "Vous demandez les forces de l'ordre par radio, à distance.", "technique": "renfort", "dT": 0, "dC": 0, "dB": 0, "temps": 2, "suite": "fin:renfort", "reaction": "Vous gardez vos distances en attendant.", "conseil": "Justifié ici si la tension a atteint le seuil : agressivité physique imminente et public à gérer."}, {"id": "c", "texte": "Vous le saisissez par le bras pour l'asseoir de force.", "technique": "contact", "dT": 25, "dC": -20, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "Il se débat violemment.", "conseil": "Le contact physique avec une personne alcoolisée devant le public est la pire option."}]}, {"id": "n3", "victime": "« Bon… j'ai mal à la tête, c'est vrai. Mais je veux pas aller aux urgences, je veux rentrer chez moi. »\n(Il s'assoit, un peu calmé.)", "choix": [{"id": "a", "texte": "« Je ne vous oblige à rien. Laissez-moi vérifier la plaie et vos pupilles, deux minutes à l'écart. Ensuite, on décide ensemble. »", "technique": "choix", "dT": -12, "dC": 12, "dB": 20, "temps": 2, "suite": "n4", "reaction": "Il acquiesce lentement.", "conseil": "Découper la demande en une étape courte et lui laisser la décision redonne du contrôle."}, {"id": "b", "texte": "« Vous venez avec nous, c'est comme ça. »", "technique": "ordre", "dT": 15, "dC": -12, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Personne me force ! »", "conseil": "L'ordre direct provoque l'opposition."}, {"id": "c", "texte": "« On vous ramène chez vous après, promis. »", "technique": "promesse", "dT": -5, "dC": -6, "dB": 5, "temps": 1, "suite": "n4", "reaction": "Il hoche la tête, méfiant.", "conseil": "Promesse que vous ne pourrez peut-être pas tenir si l'état nécessite l'hôpital."}]}, {"id": "n4", "victime": "« D'accord… Mais pas devant eux. Et vous appelez pas ma femme. »", "choix": [{"id": "a", "texte": "« Vous montez dans le véhicule, porte fermée, personne ne verra. Pour votre femme, c'est vous qui décidez de la prévenir. Je vous explique chaque geste. »", "technique": "info", "dT": -15, "dC": 15, "dB": 30, "temps": 2, "suite": "fin:apaise", "reaction": "Il monte sans discuter.", "conseil": "Respecter son intimité, lui laisser les décisions qui lui appartiennent et informer chaque geste préserve sa dignité."}, {"id": "b", "texte": "« D'accord, on s'installe tranquillement. »", "technique": "ecoute", "dT": -6, "dC": 6, "dB": 10, "temps": 1, "suite": "fin:apaise", "reaction": "Il vous suit.", "conseil": "Réponse acceptable mais peu d'informations : la dignité est partiellement préservée."}]}], "debrief": {"points": ["Isoler la victime du public avant de discuter.", "Se présenter, voix posée, sans jugement sur l'alcool.", "Proposer des étapes courtes et laisser les décisions possibles.", "Garder la sécurité de l'équipe : reculer et dégager l'espace."], "erreurs": ["Dire « vous êtes saoul ».", "Menacer d'appeler la police devant le public.", "Toucher ou saisir la personne.", "Promettre un retour à domicile."], "principes": ["L'agressivité protège ici la dignité.", "L'alcool amplifie les montées de tension et ralentit les baisses : prévoir plus de temps.", "Le renfort est justifié lorsque la tension est très haute et que la sécurité est menacée."]}, "jaugesMasquees": false}, {"rubrique": "Gestion du conflit", "publie": true, "photo": "", "vignette": "", "debut": "n1", "titre": "Arrêt cardiaque à domicile : l'épouse qui s'accroche à l'équipier", "niveau": "Avancé", "description": "Massage cardiaque en cours, épouse paniquée qui veut tout arrêter. Tenir la mission sans exclure la famille.", "contexte": {"texte": "Domicile, salon. Un homme de 62 ans est en arrêt cardiaque. Votre équipe pratique le massage et le DSA. Son épouse hurle, tire sur le bras de l'équipier qui masse et s'oppose aux gestes. Leur fille pleure dans l'entrée.", "type": "Secours à personne", "objectif": "Poursuivre la réanimation sans interruption jusqu'à l'arrivée du SMUR, en prenant soin de la famille", "gravite": 5, "tempsMax": 6, "effectifs": 3, "lieu": "Domicile, pièce exiguë", "public": "quelques", "alcool": false, "arme": false, "seuilRenfort": 70}, "victime": {"nom": "L'épouse", "etat": "peur", "tension": 80, "confiance": 20, "besoin": "proche", "besoinTexte": "Sa détresse est une peur panique, pas de l'hostilité. Elle a besoin de comprendre que ces gestes brutaux l'aident, et de garder une place auprès de son mari.", "declencheurs": ["Gestes brutaux sans explication", "Être tenue à l'écart", "Phrases culpabilisantes", "Contact physique"], "apaisants": ["Explication simple et vraie", "Un équipier dédié", "Lui confier une tâche utile", "Être près de son mari sans gêner"]}, "noeuds": [{"id": "n1", "victime": "« Arrêtez ! Vous lui cassez les côtes ! Lâchez-le, c'est mon mari, laissez-moi lui parler ! »\n(Elle tire sur le bras de l'équipier qui masse.)", "choix": [{"id": "a", "texte": "Vous écartez fermement son bras.", "technique": "contact", "dT": 20, "dC": -15, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "Elle crie et s'agrippe encore plus.", "conseil": "Même dans l'urgence, la contrainte physique nourrit la panique."}, {"id": "b", "texte": "Vous vous placez face à elle, voix ferme et basse : « Je suis le chef d'équipe. Son cœur s'est arrêté. Ce massage fait circuler le sang à sa place, il peut casser des côtes, c'est normal, c'est ce qui peut le sauver. »", "technique": "info", "dT": -14, "dC": 12, "dB": 20, "temps": 1, "suite": "n2", "reaction": "Elle vous écoute, haletante.", "conseil": "Une explication simple, vraie et rapide donne du sens aux gestes."}, {"id": "c", "texte": "« Madame, reculez ou on ne peut pas le sauver ! »", "technique": "ordre", "dT": 15, "dC": -12, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Vous me dites que c'est de ma faute ? »", "conseil": "L'ordre et la menace implicite culpabilisent."}, {"id": "d", "texte": "« Mon collègue va rester avec vous et vous explique tout. »", "technique": "choix", "dT": -8, "dC": 6, "dB": 10, "temps": 1, "suite": "n2", "reaction": "Elle se tourne vers l'équipier désigné.", "conseil": "Désigner un équipier dédié libère l'équipe et donne un interlocuteur."}]}, {"id": "n2", "victime": "« Il va mourir, hein ? Dites-moi la vérité… Je veux rester à côté de lui, laissez-moi lui tenir la main ! »", "choix": [{"id": "a", "texte": "« Vous avez très peur de le perdre et vous voulez rester près de lui. Venez à sa tête, prenez sa main, mais restez hors du massage. Mon collègue reste avec vous. »", "technique": "validation", "dT": -15, "dC": 15, "dB": 30, "temps": 1, "suite": "n3", "reaction": "Elle s'agenouille et lui prend la main.", "conseil": "Valider la peur, donner une place sûre et un accompagnant répond au besoin sans gêner la réanimation."}, {"id": "b", "texte": "« Non, non, il va s'en sortir, c'est sûr. »", "technique": "promesse", "dT": -8, "dC": -10, "dB": 0, "temps": 1, "suite": "n3", "reaction": "Elle vous regarde, sans y croire.", "conseil": "Promettre l'issue est intenable : le risque est une rupture de confiance si l'état évolue."}, {"id": "c", "texte": "« Ce n'est pas le moment, éloignez-vous. »", "technique": "ordre", "dT": 15, "dC": -15, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Vous n'avez pas le droit ! »", "conseil": "Écarter la famille sans alternative ravive la panique."}]}, {"id": "n2b", "victime": "« Non ! Je veux pas ! Vous êtes en train de le tuer ! »\n(Elle s'agrippe ; la fille hurle ; le massage est interrompu.)", "choix": [{"id": "a", "texte": "« Je ne vous touche pas. Mon collègue est avec vous. Ces gestes sont ce qui peut le sauver. » Vous confiez la famille à un équipier.", "technique": "securite", "dT": -12, "dC": 10, "dB": 10, "temps": 1, "suite": "n2", "reaction": "Elle se laisse guider, secouée.", "conseil": "Confier la famille à un équipier dédié permet de reprendre le massage sans contrainte."}, {"id": "b", "texte": "Vous demandez un renfort (SMUR renforcé et soutien à la famille) par radio.", "technique": "renfort", "dT": 0, "dC": 0, "dB": 0, "temps": 2, "suite": "fin:renfort", "reaction": "Vous restez concentré sur le massage.", "conseil": "Le renfort est légitime si la tension reste haute et que la réanimation est entravée."}, {"id": "c", "texte": "« Si je m'arrête, ce sera de votre faute ! »", "technique": "contre", "dT": 18, "dC": -15, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "Elle éclate en sanglots et hurle.", "conseil": "Culpabiliser une personne en panique aggrave tout."}]}, {"id": "n3", "victime": "« D'accord… D'accord. Je reste là. Dites-moi ce que je peux faire. »\n(Elle tremble ; la fille pleure derrière.)", "choix": [{"id": "a", "texte": "« Vous pouvez nous aider : donnez-moi ses médicaments et son nom complet, et à quelle heure il s'est effondré. Votre fille peut ouvrir la porte au SMUR. »", "technique": "choix", "dT": -15, "dC": 15, "dB": 30, "temps": 1, "suite": "n4", "reaction": "Elle se redresse et s'exécute.", "conseil": "Donner un rôle utile transforme la panique en action et fournit des informations utiles."}, {"id": "b", "texte": "« Restez à côté de moi, je vous préviens dès qu'il y a du nouveau. »", "technique": "ecoute", "dT": -8, "dC": 8, "dB": 10, "temps": 1, "suite": "n4", "reaction": "Elle acquiesce, silencieuse.", "conseil": "Soutenant, mais ne donne pas de tâche utile."}, {"id": "c", "texte": "« Ne vous occupez de rien, on gère. »", "technique": "minimise", "dT": 5, "dC": -6, "dB": 0, "temps": 1, "suite": "n3", "reaction": "Elle se tord les mains.", "conseil": "Exclure la famille de toute action laisse l'impuissance."}]}, {"id": "n4", "victime": "« Il y a du monde qui arrive… Qu'est-ce qui se passe maintenant ? »", "choix": [{"id": "a", "texte": "« Le médecin du SMUR arrive pour prendre le relais, on continue le massage. Quoi qu'il arrive, vous avez été là. Je reste avec vous et votre fille. »", "technique": "info", "dT": -15, "dC": 15, "dB": 25, "temps": 1, "suite": "fin:apaise", "reaction": "Elle pleure doucement, entourée.", "conseil": "Informer sur la suite, reconnaître sa présence et rester disponible clôture l'intervention en respectant la famille."}, {"id": "b", "texte": "« Maintenant il est entre de bonnes mains, tout ira bien. »", "technique": "promesse", "dT": -5, "dC": -6, "dB": 5, "temps": 1, "suite": "fin:apaise", "reaction": "Elle hoche la tête, fragile.", "conseil": "L'apaisement est précaire : la promesse pourra se retourner contre vous."}]}], "debrief": {"points": ["Expliquer en trois phrases pourquoi les gestes sont brutaux.", "Désigner un équipier dédié à la famille.", "Donner une place sûre et une tâche utile.", "Ne jamais interrompre le massage pour gérer la famille."], "erreurs": ["Écarter physiquement la famille.", "Culpabiliser (« ce sera de votre faute »).", "Promettre une issue.", "L'exclure de toute action."], "principes": ["La peur panique n'est pas de l'hostilité.", "Le temps est critique : chaque minute perdue fait monter la tension et compromet la mission.", "La mission clinique passe d'abord, la famille est prise en charge en parallèle."]}, "jaugesMasquees": false}, {"rubrique": "Gestion du conflit", "publie": true, "photo": "", "vignette": "", "debut": "n1", "titre": "Accident de la route : le conducteur qui refuse d'être évacué", "niveau": "Initiation", "description": "Conducteur pressé, douleur thoracique après un choc, déni et refus de soins. Découvrir ce qui le préoccupe vraiment.", "contexte": {"texte": "Collision légère en agglomération. Le conducteur, pâle, se tient la poitrine mais affirme qu'il n'a rien et veut repartir. Il a le choc de la ceinture et dit qu'il est en retard.", "type": "Secours routier", "objectif": "Réaliser le bilan et obtenir un accord éclairé pour l'évacuation", "gravite": 3, "tempsMax": 10, "effectifs": 3, "lieu": "Voie publique, circulation neutralisée", "public": "aucun", "alcool": false, "arme": false, "seuilRenfort": 70}, "victime": {"nom": "Le conducteur", "etat": "deni", "tension": 45, "confiance": 40, "besoin": "controle", "besoinTexte": "Il minimise parce qu'il doit récupérer sa fille de 6 ans à 17 h et n'a personne d'autre. Il a besoin de garder la maîtrise de ses obligations et de trouver une solution concrète.", "declencheurs": ["Ordres secs", "« Vous n'avez pas le choix »", "Mépris de ses obligations", "Promesses non tenables"], "apaisants": ["Question sur ce qui l'attend", "Solution concrète pour sa fille", "Information claire sur le risque", "Décision partagée"]}, "noeuds": [{"id": "n1", "victime": "« Ça va, c'est juste un accrochage. J'ai rien du tout, je dois partir, je suis déjà en retard. Vous pouvez me laisser, merci. »\n(Il met la clé dans le contact, la main sur la poitrine.)", "choix": [{"id": "a", "texte": "« Un accrochage ? Avec la ceinture, vous pouvez avoir des lésions graves, vous n'avez pas le choix. »", "technique": "ordre", "dT": 12, "dC": -10, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "Il se crispe : « Si, j'ai le choix ! »", "conseil": "« Vous n'avez pas le choix » provoque l'opposition."}, {"id": "b", "texte": "« Je vois que vous êtes pressé, ça doit être important. Qu'est-ce qui vous attend ? Et je vois que vous vous tenez la poitrine. »", "technique": "question", "dT": -8, "dC": 10, "dB": 20, "temps": 1, "suite": "n2", "reaction": "Il hésite et se détend.", "conseil": "Question ouverte et constat factuel ouvrent le dialogue sur ce qui compte pour lui."}, {"id": "c", "texte": "« Je ne vous retiens pas, mais laissez-moi trois minutes pour prendre votre tension. »", "technique": "limite", "dT": -6, "dC": 6, "dB": 5, "temps": 1, "suite": "n2", "reaction": "Il accepte à contrecœur.", "conseil": "Demande courte, limitée dans le temps : acceptable."}, {"id": "d", "texte": "« Vous ne savez pas ce que vous avez, laissez les professionnels décider. »", "technique": "contre", "dT": 12, "dC": -10, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Je sais ce que je ressens. »", "conseil": "Disqualifier son ressenti renforce le déni."}]}, {"id": "n2", "victime": "« Je dois récupérer ma fille à l'école à 17 h, elle a six ans, personne d'autre ne peut y aller. Et j'ai pas le temps pour les urgences, j'en ai pour des heures. »", "choix": [{"id": "a", "texte": "« Votre fille vous attend et vous êtes inquiet pour elle. Voyons ce qu'on peut organiser : qui peut aller la chercher ? Je vous aide à appeler. »", "technique": "reformulation", "dT": -14, "dC": 14, "dB": 35, "temps": 2, "suite": "n3", "reaction": "Il respire, soulagé qu'on le comprenne.", "conseil": "La reformulation reconnaît l'obligation et ouvre une solution concrète."}, {"id": "b", "texte": "« L'école peut garder votre fille, ce n'est pas un problème. »", "technique": "minimise", "dT": 10, "dC": -10, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Vous ne comprenez pas ! »", "conseil": "Minimiser son obligation nie sa préoccupation."}, {"id": "c", "texte": "« Ne vous inquiétez pas, ce sera vite fait, vous serez à l'heure. »", "technique": "promesse", "dT": -6, "dC": -8, "dB": 5, "temps": 1, "suite": "n3", "reaction": "Il hoche la tête, sceptique.", "conseil": "Promesse sur l'horaire intenable."}]}, {"id": "n2b", "victime": "« Arrêtez de me harceler ! Je signe ce que vous voulez, je pars ! »", "choix": [{"id": "a", "texte": "« Vous avez le droit de refuser et je vous l'explique clairement : une douleur à la poitrine après un choc peut cacher une lésion grave. Laissez-moi deux minutes de bilan, ensuite c'est vous qui décidez. »", "technique": "limite", "dT": -12, "dC": 10, "dB": 15, "temps": 2, "suite": "n2", "reaction": "Il hésite, puis s'immobilise.", "conseil": "Limite cadrée et information honnête sur le risque respectent son autonomie."}, {"id": "b", "texte": "Vous demandez l'avis du médecin régulateur par radio.", "technique": "renfort", "dT": 0, "dC": 0, "dB": 0, "temps": 2, "suite": "fin:renfort", "reaction": "Vous restez à ses côtés.", "conseil": "Avis médical prématuré ici : la tension n'a pas atteint le seuil, le dialogue n'est pas épuisé."}, {"id": "c", "texte": "« Vous ne partez pas, c'est moi qui décide ! »", "technique": "ordre", "dT": 15, "dC": -15, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "Il ouvre la portière.", "conseil": "L'autorité mal placée aggrave le refus."}]}, {"id": "n3", "victime": "« Ma sœur peut y aller… mais elle habite loin. Bon. Vous pensez vraiment que c'est nécessaire de venir avec vous ? »", "choix": [{"id": "a", "texte": "« Votre douleur à la poitrine est un signe à ne pas négliger. Votre sœur récupère votre fille, vous restez en contact téléphonique avec elle, et on vous emmène tout de suite. »", "technique": "info", "dT": -14, "dC": 14, "dB": 30, "temps": 2, "suite": "n4", "reaction": "Il acquiesce.", "conseil": "Une information claire sur le risque et une solution pour la fille lèvent l'obstacle."}, {"id": "b", "texte": "« C'est à vous de voir, on est là si vous changez d'avis. »", "technique": "ecoute", "dT": -4, "dC": 4, "dB": 5, "temps": 1, "suite": "n4", "reaction": "Il reste indécis.", "conseil": "Trop passif : le risque médical n'est pas expliqué."}]}, {"id": "n4", "victime": "« D'accord… Je préviens ma sœur. Je peux garder mon téléphone ? »", "choix": [{"id": "a", "texte": "« Oui, gardez-le. Je note l'heure d'arrivée et je vous donne des nouvelles si besoin. Installez-vous sur le brancard. »", "technique": "choix", "dT": -12, "dC": 14, "dB": 20, "temps": 1, "suite": "fin:apaise", "reaction": "Il s'installe, apaisé.", "conseil": "Lui laisser son téléphone redonne du contrôle."}, {"id": "b", "texte": "« Non, donnez-moi vos affaires. »", "technique": "ordre", "dT": 15, "dC": -12, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Hors de question ! »", "conseil": "Retirer ses moyens de contact ravive la crainte."}]}], "debrief": {"points": ["Chercher la raison cachée du refus avec une question ouverte.", "Proposer une solution concrète à l'obligation.", "Informer honnêtement sur le risque.", "Partager la décision."], "erreurs": ["« Vous n'avez pas le choix ».", "Minimiser l'obligation du patient.", "Promettre l'horaire.", "Retirer son téléphone."], "principes": ["Le déni cache souvent un besoin de contrôle ou une obligation.", "Respecter l'autonomie n'empêche pas d'informer fermement.", "Le renfort prématuré est pénalisé : épuiser d'abord le dialogue."]}, "jaugesMasquees": false}, {"rubrique": "Gestion du conflit", "publie": true, "photo": "", "vignette": "", "debut": "n1", "titre": "Domicile : le mari qui bloque la porte pendant le match", "niveau": "Intermédiaire", "description": "Son épouse s'est blessée à la cheville, lui veut regarder le match et refuse l'entrée des secours. Empathie, écoute active et vigilance.", "contexte": {"texte": "Soirée de match, appartement. L'épouse s'est blessée à la cheville dans la cuisine. Le mari entrouvre la porte, la bloque du pied et crie sur elle pour qu'elle se taise. On entend la télévision à fond et la femme gémir.", "type": "Secours à personne", "objectif": "Accéder à la victime, évaluer sa cheville et s'assurer qu'elle est en sécurité", "gravite": 2, "tempsMax": 10, "effectifs": 3, "lieu": "Palier d'un immeuble, puis domicile", "public": "aucun", "alcool": false, "arme": false, "seuilRenfort": 65}, "victime": {"nom": "Le mari", "etat": "colere", "tension": 60, "confiance": 15, "besoin": "reconnaissance", "besoinTexte": "Il se sent dérangé et jugé. Derrière l'agacement, il a peur que la blessure bouleverse sa soirée et la vie à la maison. Il a besoin d'être entendu sans être condamné. Vigilance : vérifier que l'épouse est en sécurité, hors de sa présence.", "declencheurs": ["Reproche sur son match", "Ordres secs", "Entrer de force", "Jugement moral"], "apaisants": ["Se présenter avec sympathie", "Reconnaître son agacement", "Rassurer sur le déroulé", "Lui laisser un rôle"]}, "noeuds": [{"id": "n1", "victime": "« C'est bon, y a rien, elle a juste le pied tordu ! Je regarde le match, revenez plus tard ! »\n(Il bloque la porte du pied. Derrière lui, on entend la femme gémir ; il crie : « Tais-toi, je t'ai dit ! »)", "choix": [{"id": "a", "texte": "« Monsieur, laissez-nous entrer, c'est une urgence. On n'a pas de rt, pendant que vous restez avec le mari devant l'écran.", "technique": "securite", "dT": -6, "dC": 6, "dB": 10, "temps": 1, "suite": "n3", "reaction": "Il reste près de la télévision.", "conseil": "Séparer discrètement les deux personnes permet d'évaluer la cheville ET la sécurité de l'épouse."}, {"id": "c", "texte": "« Votre match, ce n'est pas grave : sa cheville peut être cassée. »", "technique": "contre", "dT": 12, "dC": -10, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« Je vous ai demandé la paix ! »", "conseil": "Remettre en cause ses priorités rouvre le conflit."}, {"id": "d", "texte": "« Qu'est-ce qui s'est passé exactement ? »", "technique": "question", "dT": -6, "dC": 8, "dB": 10, "temps": 1, "suite": "n3", "reaction": "Il raconte brièvement.", "conseil": "La question ouverte l'implique sans le juger."}]}, {"id": "n2b", "victime": "« Je vous ai dit de me laisser tranquille ! Vous faites chier ! »\n(Il hausse la voix ; la femme se tait, le silence est lourd.)", "choix": [{"id": "a", "texte": "Vous reculez d'un pas, mains visibles : « Je comprends, on ne veut pas gâcher votre soirée. Mon collègue va juste voir votre épouse, vous restez ici avec moi. »", "technique": "securite", "dT": -10, "dC": 8, "dB": 5, "temps": 1, "suite": "n2", "reaction": "Il vous fixe, un peu moins tendu.", "conseil": "Reculer et proposer un cadre clair protège l'équipe et donne une porte de sortie."}, {"id": "b", "texte": "Vous demandez les forces de l'ordre par radio, calmement, en gardant votre distance.", "technique": "renfort", "dT": 0, "dC": 0, "dB": 0, "temps": 2, "suite": "fin:renfort", "reaction": "Vous gardez le contact visuel en attendant.", "conseil": "Légitime si la tension atteint le seuil, surtout avec le silence inquiétant de l'épouse."}, {"id": "c", "texte": "« Je dois entrer, c'est la loi ! »", "technique": "ordre", "dT": 12, "dC": -12, "dB": 0, "temps": 1, "suite": "n2b", "reaction": "« La loi, je m'en fous ! »", "conseil": "L'argument d'autorité aggrave l'opposition."}]}, {"id": "n3", "victime": "« Ça fait dix minutes que vous êtes là, j'ai raté un but ! Elle a déjà eu des chevilles qui traînent… Vous allez pas l'emmener, hein ? Qui va faire à manger ? »\n(Derrière l'agacement, de l'inquiétude.)", "choix": [{"id": "a", "texte": "« Vous vous demandez comment ça va se passer à la maison, c'est normal. Votre épouse a peut-être une entorse ou une fracture, il faut une radio. On vous explique tout, et on peut prévenir quelqu'un pour vous aider ce soir si vous voulez. »", "technique": "empathie", "dT": -14, "dC": 14, "dB": 30, "temps": 2, "suite": "n4", "reaction": "Il se frotte la nuque, plus calme.", "conseil": "Compassion et sympathie : on reconnaît ses craintes pratiques et on lui propose une aide concrète."}, {"id": "b", "texte": "« Non non, elle va rester à la maison, ce n'est rien. »", "technique": "promesse", "dT": -6, "dC": -8, "dB": 5, "temps": 1, "suite": "n4", "reaction": "Il se détend, mais l'épouse vous regarde, gênée.", "conseil": "Promettre sans bilan : le risque est de décevoir et de masquer une fracture."}, {"id": "c", "texte": "« Votre épouse passe avant votre match, monsieur. »", "technique": "ordre", "dT": 14, "dC": -12, "dB": -10, "temps": 1, "suite": "n2b", "reaction": "« Vous me faites la leçon ? »", "conseil": "Le jugement moral braque, même s'il est juste."}]}, {"id": "n4", "victime": "« Bon… si c'est nécessaire, elle peut y aller. Mais je viens avec vous ? »", "choix": [{"id": "a", "texte": "« Bien sûr, vous pouvez l'accompagner, ou nous rejoindre à la mi-temps : votre épouse sera entre de bonnes mains. Je note votre numéro pour vous donner des nouvelles. »", "technique": "choix", "dT": -14, "dC": 14, "dB": 25, "temps": 2, "suite": "fin:apaise", "reaction": "Il acquiesce, rassuré.", "conseil": "Un choix limité, des informations claires et un rôle respectent son besoin de contrôle."}, {"id": "b", "texte": "« On part dans deux minutes. »", "technique": "voix", "dT": -4, "dC": 4, "dB": 8, "temps": 1, "suite": "fin:apaise", "reaction": "Il hausse les épaules.", "conseil": "Acceptable mais froid : peu d'empathie, besoin partiellement satisfait."}]}], "debrief": {"points": ["Se présenter avec sympathie et reconnaître la contrariété.", "Écoute active : reformuler son agacement et son inquiétude.", "Séparer discrètement les personnes pour évaluer la sécurité de l'épouse.", "Lui proposer une aide concrète pour la maison."], "erreurs": ["Dévaloriser son match.", "Entrer de force.", "Faire la leçon morale.", "Promettre « ce n'est rien »."], "principes": ["L'agressivité masque souvent de la peur et de la gêne.", "L'empathie n'excuse pas : elle désamorce, la mission reste la même.", "Toujours rester vigilant sur d'éventuelles violences : voir la victime seule si possible, renfort justifié si la tension reste élevée."]}, "jaugesMasquees": false}, {"rubrique": "Gestion du conflit", "publie": true, "photo": "", "vignette": "", "debut": "n1", "titre": "Devant le restaurant : le gérant qui veut qu'on emmène la personne sans-abri", "niveau": "Intermédiaire", "description": "Un restaurateur à bout appelle les pompiers pour évacuer un homme sans-abri non blessé. Compassion pour les deux, écoute active.", "contexte": {"texte": "Soirée, terrasse de restaurant. Un homme sans-abri est assis à même le sol près de l'entrée, calme, sans blessure apparente. Le gérant, agité, a appelé les pompiers pour qu'ils l'emmènent : les clients partent. Quelques clients regardent.", "type": "Opérations diverses", "objectif": "Évaluer l'état de la personne sans-abri, l'orienter avec son accord et apaiser le gérant", "gravite": 1, "tempsMax": 12, "effectifs": 3, "lieu": "Devant un restaurant, trottoir", "public": "quelques", "alcool": false, "arme": false, "seuilRenfort": 70}, "victime": {"nom": "Le gérant", "etat": "colere", "tension": 60, "confiance": 25, "besoin": "reconnaissance", "besoinTexte": "Il est en difficulté financière et se sent démuni : il a besoin que sa détresse professionnelle soit r   ["q1", "Débit de solution moussante Qext", "l/min", "Qext = S × TA"],
  ["q2", "Débit d'eau total Qtotal", "l/min", "Qtotal = Qext + Qref"],
  ["q3", "Nombre de GALIM nécessaires", "GALIM", "Si Qtotal > débit réseau : 1 GALIM = 4 000 l/min"],
  ["q4", "Volume d'émulseur d'extinction Vext (40 min)", "L", "Vext = Qext × C(%) × t"],
  ["q5", "Volume d'émulseur d'entretien Vetm (10 min)", "L", "Vetm = Qext × C(%) × 10"],
  ["q6", "Volume tapis préventif Vtmp", "L", "Vtmp = (S × h × C) / 100 × 1000"],
  ["q7", "Volume entretien préventif Vetmp", "L", "Vetmp = 0,2 × S × C × 10"],
  ["q8", "Volume total d'émulseur", "L", "TOTAL = Vext + Vetm + Vtmp + Vetmp"],
];

const taOf = (ex) => (ex.miscible ? 20 : 10);

function attendu(ex) {
  const TA = taOf(ex), C = ex.C;
  const q1 = ex.S * TA, q2 = q1 + ex.Qref;
  const q3 = q2 > ex.reseau ? Math.max(1, Math.ceil((q2 - ex.reseau) / GALIM_DEBIT)) : 0;
  const q4 = Math.round(q1 * (C / 100) * 40), q5 = Math.round(q1 * (C / 100) * 10);
  const q6 = Math.round((ex.S * ex.h * C) / 100 * 1000), q7 = Math.round(0.2 * ex.S * C * 10);
  return { q1, q2, q3, q4, q5, q6, q7, q8: q4 + q5 + q6 + q7 };
}

function detail(ex) {
  const a = attendu(ex), TA = taOf(ex), C = ex.C, f = (n) => String(n).replace(".", ",");
  return {
    q1: `${ex.S} × ${TA} = ${a.q1} l/min`,
    q2: `${a.q1} + ${ex.Qref} = ${a.q2} l/min (réseau : ${ex.reseau} l/min)`,
    q3: a.q2 > ex.reseau ? `${a.q2} > ${ex.reseau} : déficit ${a.q2 - ex.reseau} l/min → ${a.q3} GALIM` : `${a.q2} ≤ ${ex.reseau} : le réseau suffit → 0 GALIM`,
    q4: `${a.q1} × ${f(C / 100)} × 40 = ${a.q4} L`,
    q5: `${a.q1} × ${f(C / 100)} × 10 = ${a.q5} L`,
    q6: `(${ex.S} × ${f(ex.h)} × ${C}) / 100 × 1000 = ${a.q6} L`,
    q7: `0,2 × ${ex.S} × ${C} × 10 = ${a.q7} L`,
    q8: `${a.q4} + ${a.q5} + ${a.q6} + ${a.q7} = ${a.q8} L`,
  };
}

const estJuste = (rep, att) => {
  const v = Number(String(rep ?? "").replace(",", "."));
  if (rep === "" || rep == null || Number.isNaN(v)) return false;
  return Math.abs(v - att) <= Math.max(1, Math.abs(att) * TOLERANCE);
};

function corriger(ex, rep) {
  const a = attendu(ex), res = {};
  let ok = 0;
  CALC_Q.forEach(([k]) => { res[k] = estJuste(rep[k], a[k]); if (res[k]) ok++; });
  return { res, ok, tot: CALC_Q.length, att: a };
}

const mettreEssai = (calculs, exId, essai) => {
  const l = [...((calculs || {})[exId] || []), essai].slice(-10);
  return { ...(calculs || {}), [exId]: l };
};
const resumeCalculs = (calculs) => {
  const o = {};
  for (const [k, l] of Object.entries(calculs || {})) if (l && l.length) o[k] = { n: l.length, best: Math.max(...l.map((x) => x.ok)), last: l[l.length - 1].ok, tot: l[l.length - 1].tot, le: l[l.length - 1].le };
  return o;
};

function calcMemoHtml(){return `<div class="card"><h3 style="margin-top:0">Fiche mémo · dimensionnement de l'extinction LIF</h3><p><b>Débit solution moussante</b> : Qext = S × TA (TA : 10 l/min/m² non miscible, 20 l/min/m² miscible)</p><p><b>Débit eau total</b> : Qtotal = Qext + Qref. Si Qtotal &gt; débit réseau incendie : GALIM (1 GALIM = 4 000 l/min à 1 000 m).</p><p><b>Volumes d'émulseur</b> : Extinction (t = 40 min) Vext = Qext × C(%) × t · Entretien tapis (10 min/heure) Vetm = Qext × C(%) × 10</p><p>Tapis préventif (sous-cuvette adjacente), F = 7, h = 0,15 m, TA entretien = 0,2 l/min/m² : Vtmp = (S × h × C) / 100 × 1000 · Vetmp = 0,2 × S × C × 10</p><p><b>TOTAL</b> = Vext + Vetm + Vtmp + Vetmp</p><p class="muted" style="margin:0">Même méthode que l'onglet Extinction LIF de TOPIMI (Fiche mémo 1er COS). Vérifie ensuite avec le calculateur.</p></div>`}

lise le formulaire de contact. Tu peux aussi saisir la CNIL (cnil.fr) si tu estimes que tes droits ne sont pas respectés."], ["7. Conservation", "Les données sont conservées tant que le compte est actif, puis supprimées sur demande ou à la suppression du compte."], ["8. Usage acceptable", "Il est interdit de tenter d'accéder aux comptes ou données d'autrui, de perturber le service, d'en extraire les scénarios pour les diffuser sans autorisation ou d'y saisir des informations sensibles ou nominatives sur de vraies interventions et des victimes réelles. Un compte peut être suspendu en cas de manquement."], ["9. Propriété intellectuelle", "L'application, ses scénarios, textes, illustrations et logo sont protégés. Toute reproduction ou réutilisation sans autorisation préalable est interdite, hors usage personnel de formation."], ["10. Disponibilité et responsabilité", "L'application est fournie en l'état, sans garantie de disponibilité continue. L'éditeur ne peut être tenu responsable d'une interruption, d'une perte de données ou d'un usage des contenus en dehors du cadre pédagogique."], ["11. Évolution des conditions", "Ces conditions peuvent évoluer ; la date de mise à jour figure en haut de la page. L'utilisation de l'application après modification vaut acceptation."]];
