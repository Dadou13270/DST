<meta name="claude:viewport-fit-sides" content="cover">

<style>

:root{
  --bg:#eef0f2; --card:#ffffff; --ink:#1b2127; --mut:#667079; --line:#d8dde1;
  --red:#c42a1c; --red-d:#9d2015; --on-red:#ffffff; --ok:#16794a; --warn-bg:#fdf1d6; --soft:#f5f6f7;
  --me:#c42a1c; --me-ink:#ffffff;

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:.9375rem/1.5 var(--f-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-d);letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--red);color:var(--on-red);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--f-d);font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bar nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar button{background:transparent;color:var(--on-red);border:1px solid rgba(255,255,255,.45);padding:5px 12px;border-radius:6px;font:inherit;cursor:pointer}
.bar button.on{background:#fff;color:var(--red-d)}
.timer{font-family:var(--f-m);background:rgba(0,0,0,.25);padding:3px 10px;border-radius:6px}.timer.late{background:#f5b82e;color:#000}
main{max-width:1180px;margin:0 auto}
/* pages de contenu : cartes en colonnes sur toute la largeur */
main.pg-profil,main.pg-aide,main.pg-aidesalle,main.pg-apropos,main.pg-cgu,main.pg-nouveautes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}

.card.form select{width:100%}
main.pg-profil>*,main.pg-aide>*,main.pg-aidesalle>*,main.pg-apropos>*,main.pg-cgu>*,main.pg-nouveautes>*{grid-column:1/-1;min-width:0}

.muted{color:var(--mut)}.pre{white-space:pre-wrap}.err{color:#d6382a}.okt{color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;min-width:0}
.card.warn{background:var(--warn-bg)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:7px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--red)}.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.dng{color:#d6382a}.btn.big{padding:11px 22px;font-size:1.05rem;margin-top:10px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.dom{background:var(--card);border-color:var(--pri,#c0392b);font-weight:600}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
select{width:auto;max-width:100%}textarea{resize:vertical}input[type=checkbox]{width:auto}
.form label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}.form label.ck{display:flex;gap:8px;align-items:center;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scn{padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;margin:0}.scn img,.scn .ph{flex:none}.scn:hover{border-color:var(--red)}
.scn img,.scn .ph{width:100%;height:150px;object-fit:cover;display:block}.scn .b{padding:12px}
.scn .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}.scn .b{display:flex;flex-direction:column;flex:1}.scn .b h2{margin:0 0 4px;font-size:1.05rem}.meta{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;margin-top:4px;font-size:.88rem}.st{font-weight:700}.st.ok{color:var(--ok)}.st.br{color:#b26a00}.bdg{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.tag.dom,.tag.evo{border:0;font-weight:600;font-size:.72rem;padding:2px 8px;background:#fde8ec;color:#c8102e}.tag.evo{background:#fff3d6;color:#8a5a12}.scn .tag{border:0;font-weight:600;font-size:.72rem;padding:2px 8px;margin:0 4px 4px 0;background:#eef1f6;color:#3b4658}.scn .tag.dom{background:#fde8ec;color:#c8102e}.scn .tag.evo{background:#fff3d6;color:#8a5a12}.scn .b p,.scn-body p{margin:0 0 8px;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}


.ph{background:var(--soft);color:var(--mut);display:grid;place-items:center}.ph.tall{height:200px;border-radius:8px}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;background:var(--soft)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:10px 0;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 14px;font:inherit;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--red);border-color:var(--red);font-weight:600}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.photo{width:100%;max-height:380px;object-fit:contain;background:#000;border-radius:8px;cursor:zoom-in;display:block}.photo.z{max-height:none;cursor:zoom-out}
.photo.prev{max-height:200px;width:auto}
.consigne{font-style:italic}
.domblk{margin:18px 0 6px}.domblk>label{margin:0 0 8px}.domblk .doml{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.domblk .row{margin:0 0 10px}.domblk .chips{margin:0}.domblk+label{margin-top:20px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

.chat{height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft)}

.ask{display:flex;gap:8px;margin-top:8px}

.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.foot .fcopy{border-top:1px solid #2e373f;text-align:center;padding:14px 24px;color:#8a949d;font-size:.8rem}

const WIN={"—":0x97,"–":0x96,"’":0x92,"‘":0x91,"“":0x93,"”":0x94,"…":0x85,"œ":0x9c,"Œ":0x8c,"€":0x80,"•":0x95};
function pdfBuild(title,sub,secs){
 const pages=[];let ops,y;const np=()=>{ops=[];pages.push(ops);y=64};
 const L=t=>{let o="";for(const ch of String(t)){const m=WIN[ch],c=m!==undefined?m:(ch.codePointAt(0)<256?ch.codePointAt(0):63),r=String.fromCharCode(c);o+=(r==="("||r===")"||r==="\\")?"\\"+r:r}return o};
 const T=(x,yy,t,sz=9,f="F1")=>ops.push(`BT /${f} ${sz} Tf ${x} ${842-yy} Td (${L(t)}) Tj ET`);
 const wrap=(t,w,sz)=>{const mx=Math.max(4,Math.floor(w/(sz*.5))),out=[];let cur="";for(const wd of String(t).split(" ")){if((cur+" "+wd).trim().length>mx&&cur){out.push(cur);cur=wd}else cur=(cur+" "+wd).trim();while(cur.length>mx){out.push(cur.slice(0,mx));cur=cur.slice(mx)}}out.push(cur);return out};
 np();ops.push("0.77 0.16 0.11 rg 0 812 595 30 re f");ops.push("1 1 1 rg");T(40,26,"Op'Training",13,"F2");ops.push("0.1 0.13 0.15 rg");
 T(40,y,title,16,"F2");y+=18;ops.push("0.4 0.4 0.4 rg");T(40,y,sub+" · édité le "+new Date().toLocaleDateString("fr-FR",{dateStyle:"long"}),9);ops.push("0.1 0.13 0.15 rg");y+=22;
 for(const sec of secs){
  if(sec.h){if(y>760)np();T(40,y,sec.h,12,"F2");y+=8}
  const row=(cells,head)=>{const sz=9,ls=cells.map((c,i)=>wrap(c,sec.w[i]-8,sz)),n=Math.max(...ls.map(a=>a.length)),hgt=n*11+8;
   if(y+hgt>800)np();
   if(head){ops.push(`0.77 0.16 0.11 rg 40 ${842-y-hgt+4} ${sec.w.reduce((a,b)=>a+b,0)} ${hgt} re f`);ops.push("1 1 1 rg")}
   let x=40;ls.forEach((a,i)=>{a.forEach((l,k)=>T(x+4,y+k*11+9,l,sz,head?"F2":"F1"));x+=sec.w[i]});
   if(head)ops.push("0.1 0.13 0.15 rg");else ops.push(`0.85 0.86 0.88 RG 40 ${842-y-hgt+4} m ${40+sec.w.reduce((a,b)=>a+b,0)} ${842-y-hgt+4} l S`);
   y+=hgt};
  row(sec.head,true);if(!sec.rows.length)row(["Aucun exercice terminé",...sec.head.slice(1).map(()=>"")],false);sec.rows.forEach(r=>row(r,false));y+=14}
 pages.forEach((o,i)=>{ops=o;ops.push("0.45 0.45 0.45 rg");T(520,830,`Page ${i+1}/${pages.length}`,8)});
 const objs=[];const add=s=>(objs.push(s),objs.length);
 add("<< /Type /Catalog /Pages 2 0 R >>");add("");add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
 const kids=[];pages.forEach(o=>{const c=o.join("\n"),ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`),pi=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`);kids.push(pi+" 0 R")});
 objs[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`;
 let out="%PDF-1.4\n",offs=[];objs.forEach((b,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${b}\nendobj\n`});
 const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}

 await dl.save({filename:nom,data:new Blob([pdfBuild(title,sub,secs)],{type:"application/pdf"})})}catch(e){if(!e||e.code!=="declined")toast("Export impossible : "+((e&&e.message)||e),true)}}

 const nm=c=>{const x=FRM.d.find(y=>y[0]===c);if(x)return x[1];const dp=(DEPTS||[]).find(y=>deptCode(y)===c);return dp?dp.slice(c.length+1):(c||"Non renseigné")};

 h+=`<div class="card"><svg class="fmap" viewBox="${FRM.vb}" role="img" aria-label="Carte de France des inscrits par département">`+FRM.d.map(([c,n,p])=>{const k=cnt[c]||0;const fill=k?`color-mix(in srgb,var(--red) ${Math.round(25+75*k/max)}%,var(--card,#fff))`:"var(--soft)";return `<path d="${p}" data-act="cdep" data-arg="d${c}" class="${carteSel===c?"sel":""}" style="fill:${fill}"><title>${esc(c+" "+n)} : ${k} inscrit${k>1?"s":""}</title></path>`}).join("")+`</svg>
 <p style="margin:8px 0 0"><b>${carteSel?esc(carteSel+" "+nm(carteSel))+" : "+(cnt[carteSel]||0)+" inscrit"+((cnt[carteSel]||0)>1?"s":""):"Touche un département pour voir le détail."}</b></p></div>`;

function compress(file,max,q,maxChars=0){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  let o=c.toDataURL("image/jpeg",q);while(maxChars&&o.length>maxChars&&q>.3){q-=.1;o=c.toDataURL("image/jpeg",q)}res(o)};
 im.onerror=()=>rej(new Error("Image illisible"));im.src=u})}
